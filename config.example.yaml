# Куда слать подсказки. Рекомендуется "me" — подсказки придут в «Избранное»
# (Saved Messages). У приватной группы НЕТ username: для неё укажи числовой
# chat id, а не имя. Username работает только у публичных каналов/групп.
panel_chat: me
# Сколько последних сообщений диалога отдавать модели как контекст.
# Если в чате их меньше — возьмутся все, что есть.
context_messages: 50
# Тона вариантов: сколько строк — столько вариантов предложит модель.
# Пиши своими словами, это идёт прямо в промпт и в подписи к вариантам.
tones:
  - игривый, с лёгким флиртом
  - тёплый, искренний
  - лёгкий, с юмором
  - спокойный, уместный — рекомендуемый

# Манера письма: как именно писать, что можно и чего нельзя.
style: |
  Пиши на русском, как живой человек в обычной переписке: короткими простыми
  фразами, разговорно. Без канцелярита, пафоса, витиеватых метафор, пошлости и
  двусмысленных намёков. Не здоровайся, если разговор уже идёт, и не
  пересказывай то, что собеседник только что сказал.

# Модель DeepSeek. На замерах pro оказался и быстрее, и точнее flash — см.
# «Выбор модели» в README. Список доступных: client.models.list().
model: deepseek-v4-pro

# Насколько модель вольничает. Меньше — сдержаннее и ближе к тексту переписки,
# больше — изобретательнее и цветистее. Разумный диапазон 0.3–1.0.
temperature: 0.7

# Самообучение: бот запоминает, что из предложенного ты отправил, что написал
# сам и как на это ответили, — и подмешивает твою манеру в промпт. Тексты
# переписок при этом хранятся в suflor.db открытым текстом (файл в .gitignore).
# Стереть данные по человеку: /forget @username. Собрать корпус из истории:
# /train. Посмотреть, что накопилось: /stats.
learning:
  enabled: true
  min_samples: 5           # меньше своих сообщений — профиль не собирается
  style_examples: 8        # сколько образцов класть в промпт
  chat_examples: 5         # из них — из этого же диалога
  match_window_minutes: 60 # насколько свежей должна быть подсказка
  outcome_window_hours: 12 # сколько ждём ответа, прежде чем считать «молчит»
  train_chats: 20          # сколько диалогов просматривает /train
  train_messages: 200      # и сколько сообщений берёт из каждого

# Факты обо мне: имя, возраст, город, работа, увлечения. Нужны, чтобы бот
# отвечал на вопросы собеседницы обо мне, а не выкручивался общими словами.
# Скопируй about.example.md в about.md, перепиши под себя и укажи здесь
# about.md — about.md в git не попадает. Путь считается от этого файла,
# правки применяются при перезапуске. Строку можно убрать вовсе: без профиля
# бот работает как раньше и о себе ничего не говорит.
about_file: about.example.md

# Кого игнорировать (не предлагать ответы)
ignore_usernames: []
ignore_user_ids: []
