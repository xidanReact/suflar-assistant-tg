# Куда слать подсказки. Рекомендуется "me" — подсказки придут в «Избранное»
# (Saved Messages). У приватной группы НЕТ username: для неё укажи числовой
# chat id, а не имя. Username работает только у публичных каналов/групп.
panel_chat: me
# Сколько последних сообщений диалога отдавать модели как контекст.
# Если в чате их меньше — возьмутся все, что есть.
context_messages: 500
# Кого игнорировать (не предлагать ответы)
ignore_usernames: []
ignore_user_ids: []
